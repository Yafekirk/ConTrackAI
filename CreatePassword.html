<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="/assets/css/CP.css">
<link rel="stylesheet" href="/assets/css/auth-brand-mobile.css">
<link rel="stylesheet" href="/assets/css/password-toggle.css">
<link rel="stylesheet" href="/assets/css/terms-modal.css">
</head>

<body>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="brand-row">
            <img src="/assets/images/Logo.png" class="logo">
            <div class="divider"></div>
            <div class="brand-text">
                <h1>ConTrack <span>AI</span></h1>
                <p>— CONTRACT MANAGEMENT SYSTEM —</p>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <div class="mobile-brand">
            <div class="brand-intro" aria-hidden="true">
                <span style="--i:0">W</span>
                <span style="--i:1">e</span>
                <span style="--i:2">l</span>
                <span style="--i:3">c</span>
                <span style="--i:4">o</span>
                <span style="--i:5">m</span>
                <span style="--i:6">e</span>
                <span class="intro-gap" style="--i:7">t</span>
                <span style="--i:8">o</span>
                <span class="intro-gap" style="--i:9">C</span>
                <span style="--i:10">o</span>
                <span style="--i:11">n</span>
                <span style="--i:12">T</span>
                <span style="--i:13">r</span>
                <span style="--i:14">a</span>
                <span style="--i:15">c</span>
                <span style="--i:16">k</span>
                <span class="intro-ai intro-gap" style="--i:17">A</span>
                <span class="intro-ai" style="--i:18">I</span>
                <span style="--i:19">!</span>
            </div>
            <div class="brand-row">
                <img src="/assets/images/Logo.png" class="logo" alt="ConTrack AI logo">
                <div class="divider"></div>
                <div class="brand-text">
                    <h1>ConTrack <span>AI</span></h1>
                    <p>— CONTRACT MANAGEMENT SYSTEM —</p>
                </div>
            </div>
        </div>

        <div class="login-card">

            <h2 class="welcome">Create Account</h2>
            <p class="subtitle">SIGN UP TO CONTRACK AI</p>

            <form id="signupForm" novalidate>

                <div class="input-group">
                    <label for="signupName">COMPANY NAME</label>
                    <input id="signupName" name="company_name" type="text" placeholder="Enter your company name"
                           required minlength="2" maxlength="120"
                           autocomplete="organization">
                    <p class="field-error" id="signupNameError" hidden></p>
                </div>

                <div class="input-group">
                    <label for="signupEmail">EMAIL ADDRESS</label>
                    <input id="signupEmail" name="email" type="email" placeholder="Enter your email address"
                           required maxlength="254" autocomplete="email">
                    <p class="field-error" id="signupEmailError" hidden></p>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="signupContact">CONTACT NUMBER</label>
                        <input id="signupContact" name="contact_number" type="tel" inputmode="numeric"
                               placeholder="09XXXXXXXXX"
                               required maxlength="16" pattern="[+0-9][0-9 ]*"
                               autocomplete="tel">
                        <p class="field-error" id="signupContactError" hidden></p>
                    </div>

                    <div class="input-group">
                        <label for="signupSupplierType">SUPPLIER TYPE</label>
                        <select id="signupSupplierType" name="supplier_type" required>
                            <option value="">Select supplier type</option>
                            <option value="Supply">Supply</option>
                            <option value="Lease">Lease</option>
                            <option value="Service">Service</option>
                            <option value="Other">Other</option>
                        </select>
                        <p class="field-error" id="signupSupplierError" hidden></p>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="signupPassword">PASSWORD</label>
                        <input id="signupPassword" name="password" type="password" placeholder="Create a password"
                               required minlength="8" maxlength="64" autocomplete="new-password">
                        <p class="field-error" id="signupPasswordError" hidden></p>
                    </div>

                    <div class="input-group">
                        <label for="signupConfirmPassword">CONFIRM PASSWORD</label>
                        <input id="signupConfirmPassword" name="confirm_password" type="password"
                               placeholder="Confirm your password"
                               required minlength="8" maxlength="64" autocomplete="new-password">
                        <p class="field-error" id="signupConfirmError" hidden></p>
                    </div>
                </div>

                <div class="terms">
                    <label for="signupTerms">
                        <input id="signupTerms" type="checkbox" required>
                        <span class="terms-consent-text">
                            I agree to the
                            <button type="button" class="terms-link" data-terms-open data-terms-gated-by="signupTerms">Terms &amp; Conditions</button> and
                            <button type="button" class="terms-link" data-terms-open data-terms-gated-by="signupTerms">Privacy Policy</button>
                        </span>
                    </label>
                    <p class="field-error" id="signupTermsError" hidden></p>
                </div>

                <button type="submit">SIGN UP →</button>
                <p id="signupError" style="display:none;color:#ef4444;font-size:12px;margin-top:10px;"></p>

                <div class="create-account">
                    Already have an account?
                    <a href="index.html">Sign In</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
<script type="module" src="/assets/js/signup.js"></script>
<script type="module" src="/assets/js/password-toggle.js"></script>
</html>
